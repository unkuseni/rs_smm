# Configuration for your trading application

# Name of the exchange you're connecting to (bybit or binance).
# "both" is experimental and not yet supported by the strategy loop.
exchange = "bybit"

# List of symbols to track and trade
symbols = ["NOTUSDT"] # Replace with your desired symbols

# API keys for authentication (key, secret, symbol).
# Prefix a value with "env:" to load it from an environment variable instead
# of storing it in this file, e.g. "env:RS_SMM_API_KEY".
api_keys = [["api_key_1", "api_secret_1", "NOTUSDT"]]

# Initial balances for tracked symbols (symbol, balance)
balances = [["NOTUSDT", 100.0]]

# Leverage for trading positions (clamped to 1..=100)
leverage = 12.0

# Number of orders to place on each side of the market
orders_per_side = 4

# Final order distance: multiplier of the quote spread for the furthest level
final_order_distance = 10

# Number of order book levels (depth) to use for the market-microstructure features
depths = [3, 8, 34]

# Number of batch API calls allowed before the rate-limit counters refresh
# (they refresh roughly once per second)
rate_limit = 10

# Feature lookback window: 1 tick = 10ms, so 8000 ticks = 80s
tick_window = 8000

# Profit spread per symbol in basis points (1 bp = 0.01%)
[bps]
NOTUSDT = 25
