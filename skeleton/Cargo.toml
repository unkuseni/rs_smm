[package]
name = "skeleton"
version = "0.1.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# User's binance-rs fork: async REST/WS APIs, TimeInForce::GTX post-only,
# FuturesStream high-level subscriptions with auto listen-key keep-alive.
binance = { git = "https://github.com/unkuseni/binance-rs", branch = "master" }
bincode = "1.3.3"
num-traits = "0.2.19"
ordered-float = { version = "4.2.0", features = ["serde"] }
# Latest rs_bybit (0.4.x): flat crate-root re-exports plus a `Bybit`
# constructor trait.
rs_bybit = "0.4"
serde = "1.0.197"
tokio = "1.36.0"
toml = "0.8.12"
